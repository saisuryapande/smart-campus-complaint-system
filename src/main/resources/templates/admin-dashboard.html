<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard - Smart Campus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="dashboard-page">
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h2><i class="fas fa-shield-alt me-2"></i>Admin Dashboard</h2>
            <a href="/users/logout" class="btn btn-danger">
                <i class="fas fa-sign-out-alt me-2"></i>Logout
            </a>
        </div>

        <!-- Success Message (auto-dismiss) -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert" id="successAlert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${success}">Success message</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Error Message (auto-dismiss) -->
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert" id="errorAlert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${error}">Error message</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Statistics Cards -->
        <div class="row">
            <div class="col-md-3">
                <div class="card bg-primary">
                    <div class="card-body">
                        <h5 class="card-title">Total Complaints</h5>
                        <h2 class="card-text" th:text="${total}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-warning">
                    <div class="card-body">
                        <h5 class="card-title">Pending</h5>
                        <h2 class="card-text" th:text="${pending}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-success">
                    <div class="card-body">
                        <h5 class="card-title">Resolved</h5>
                        <h2 class="card-text" th:text="${resolved}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-danger">
                    <div class="card-body">
                        <h5 class="card-title">Rejected</h5>
                        <h2 class="card-text" th:text="${rejected}">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Complaints Table -->
        <div class="table-wrapper">
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>User</th>
                        <th>Category</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${complaints}">
                        <td><strong>#<span th:text="${c.complaintId}">1</span></strong></td>
                        <td th:text="${c.title}">WiFi Issue</td>
                        <td>
                            <span th:if="${c.user != null}" th:text="${c.user.name}">John Doe</span>
                            <span th:unless="${c.user != null}" class="text-muted">Unknown</span>
                        </td>
                        <td th:text="${c.category}">Hostel</td>
                        <td>
                            <span class="badge" th:classappend="${c.priority == 'High'} ? 'bg-danger' : 
                                                           (${c.priority == 'Medium'} ? 'bg-warning' : 'bg-success')"
                                  th:text="${c.priority}">Medium</span>
                        </td>
                        <td>
                            <span class="badge" th:classappend="${c.status == 'Pending'} ? 'bg-warning' : 
                                                           (${c.status == 'Resolved'} ? 'bg-success' : 'bg-danger')"
                                  th:text="${c.status}">Pending</span>
                        </td>
                        <td>
                            <form th:action="@{/admin/update/{id}(id=${c.complaintId})}" method="post" class="d-inline">
                                <select name="status" class="form-select d-inline w-auto" style="width: auto !important; padding: 5px;">
                                    <option value="Pending" th:selected="${c.status == 'Pending'}">Pending</option>
                                    <option value="Resolved" th:selected="${c.status == 'Resolved'}">Resolved</option>
                                    <option value="Rejected" th:selected="${c.status == 'Rejected'}">Rejected</option>
                                </select>
                                <button type="submit" class="btn btn-sm btn-warning">
                                    <i class="fas fa-sync-alt"></i>
                                </button>
                            </form>
                            <a th:href="@{/admin/delete/{id}(id=${c.complaintId})}" 
                               class="btn btn-sm btn-danger"
                               onclick="return confirm('Are you sure you want to delete this complaint?\nThis action cannot be undone!');">
                                <i class="fas fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auto-dismiss alerts after 5 seconds
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                const successAlert = document.getElementById('successAlert');
                const errorAlert = document.getElementById('errorAlert');
                
                if (successAlert) {
                    successAlert.style.transition = 'opacity 0.5s';
                    successAlert.style.opacity = '0';
                    setTimeout(() => successAlert.remove(), 500);
                }
                
                if (errorAlert) {
                    errorAlert.style.transition = 'opacity 0.5s';
                    errorAlert.style.opacity = '0';
                    setTimeout(() => errorAlert.remove(), 500);
                }
            }, 5000);
        });
    </script>
</body>
</html>
