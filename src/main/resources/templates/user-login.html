<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Login - Smart Campus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .login-card h2 { text-align: center; margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; }
        .input-group-text { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; }
        .btn-login { background: linear-gradient(135deg, #667eea, #764ba2); color: white; width: 100%; padding: 12px; border-radius: 10px; border: none; }
        .btn-login:hover { transform: translateY(-2px); }
        .password-toggle { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; z-index: 10; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2><i class="fas fa-user-graduate me-2"></i>Student Login</h2>
        <div th:if="${error}" class="alert alert-danger"><span th:text="${error}"></span></div>
        <form action="/users/login" method="post">
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                <input type="email" name="email" class="form-control" placeholder="Email Address" required>
            </div>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input type="password" name="password" id="password" class="form-control" placeholder="Password" required>
                <i class="fas fa-eye password-toggle" id="togglePassword" onclick="togglePassword()"></i>
            </div>
            <button type="submit" class="btn-login">Login</button>
            <div class="text-center mt-3">
                <a href="/user/register">Create Account</a> | <a href="/login-choice">Back</a>
            </div>
        </form>
    </div>
    <script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('togglePassword');
            if (pwd.type === 'password') { pwd.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash'); }
            else { pwd.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye'); }
        }
    </script>
</body>
</html>
