<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register - Smart Campus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .password-toggle {
            cursor: pointer;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            color: #667eea;
        }
        .input-group {
            position: relative;
        }
        .input-group .form-control {
            padding-right: 45px;
        }
    </style>
</head>
<body>
    <div class="register-card">
        <h2><i class="fas fa-user-plus me-2"></i>Create Account</h2>
        
        <!-- Success Alert -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert" id="successAlert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${success}">Account created successfully</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <!-- Error Alert -->
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert" id="errorAlert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${error}">Error message</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <form action="/users/register" method="post" id="registerForm" autocomplete="off">
            <div class="input-group mb-3">
                <span class="input-group-text"><i class="fas fa-user"></i></span>
                <input type="text" name="name" class="form-control" placeholder="Enter your full name" 
                       autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" required>
            </div>
            
            <div class="input-group mb-3">
                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                <input type="email" name="email" class="form-control" placeholder="Enter your email" 
                       autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" required>
            </div>
            
            <div class="input-group mb-3">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input type="password" name="password" id="password" class="form-control" placeholder="Create a password" 
                       autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly')" required>
                <i class="fas fa-eye password-toggle" id="togglePassword" onclick="togglePasswordVisibility('password', 'togglePassword')"></i>
            </div>
            
            <div class="input-group mb-3">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm password" 
                       autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly')" required 
                       onkeyup="checkPasswordMatch(this)">
                <i class="fas fa-eye password-toggle" id="toggleConfirmPassword" onclick="togglePasswordVisibility('confirmPassword', 'toggleConfirmPassword')"></i>
            </div>
            
            <small id="passwordMatchMsg" class="text-danger mb-3" style="display: none;">Passwords do not match!</small>
            
            <button type="submit" class="btn btn-success" onclick="showLoading(this)">
                <i class="fas fa-check-circle me-2"></i>Register
            </button>
            
            <a href="/users/login" class="btn btn-secondary">
                <i class="fas fa-arrow-left me-2"></i>Back to Login
            </a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Toggle password visibility
        function togglePasswordVisibility(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const toggleIcon = document.getElementById(iconId);
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // Show loading effect on button
        function showLoading(button) {
            button.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Registering...';
        }

        // Check if passwords match
        function checkPasswordMatch(input) {
            const password = document.querySelector('input[name="password"]').value;
            const confirmPassword = document.getElementById('confirmPassword');
            const msg = document.getElementById('passwordMatchMsg');
            
            if(input.value !== password) {
                msg.style.display = 'block';
                confirmPassword.style.borderColor = '#dc3545';
            } else {
                msg.style.display = 'none';
                confirmPassword.style.borderColor = '#28a745';
            }
        }

        // Auto-dismiss alerts after 5 seconds
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                const successAlert = document.getElementById('successAlert');
                const errorAlert = document.getElementById('errorAlert');
                
                if (successAlert) {
                    successAlert.style.transition = 'opacity 0.5s';
                    successAlert.style.opacity = '0';
                    setTimeout(() => successAlert.remove(), 500);
                }
                
                if (errorAlert) {
                    errorAlert.style.transition = 'opacity 0.5s';
                    errorAlert.style.opacity = '0';
                    setTimeout(() => errorAlert.remove(), 500);
                }
            }, 5000);
        });

        // Clear any autofilled values on page load
        window.onload = function() {
            document.querySelectorAll('input').forEach(input => {
                input.value = '';
            });
        }
    </script>
</body>
</html>
