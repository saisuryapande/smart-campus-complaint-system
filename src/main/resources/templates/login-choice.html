<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Smart Campus - Login Choice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .choice-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            transition: transform 0.3s;
            height: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .choice-card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .choice-card i { font-size: 70px; margin-bottom: 20px; }
        .choice-card h3 { font-size: 28px; font-weight: 700; margin-bottom: 15px; }
        .choice-card p { color: #666; margin-bottom: 25px; }
        .btn-user { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 12px 40px; border-radius: 30px; text-decoration: none; display: inline-block; }
        .btn-admin { background: linear-gradient(135deg, #f093fb, #f5576c); color: white; padding: 12px 40px; border-radius: 30px; text-decoration: none; display: inline-block; }
        h2 { color: white; text-align: center; margin-bottom: 40px; font-size: 2rem; }
    </style>
</head>
<body>
    <div class="container">
        <h2><i class="fas fa-graduation-cap me-2"></i>Smart Campus</h2>
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="choice-card">
                    <i class="fas fa-user-graduate" style="color: #667eea;"></i>
                    <h3>Student Login</h3>
                    <p>Access your dashboard, submit complaints, and track status</p>
                    <a href="/user/login" class="btn-user"><i class="fas fa-sign-in-alt me-2"></i>Login as Student</a>
                    <div class="mt-3"><small>New student? <a href="/user/register">Create Account</a></small></div>
                </div>
            </div>
            <div class="col-md-6 mb-4">
                <div class="choice-card">
                    <i class="fas fa-shield-alt" style="color: #f5576c;"></i>
                    <h3>Admin Login</h3>
                    <p>Manage complaints, update status, and view analytics</p>
                    <a href="/admin/login" class="btn-admin"><i class="fas fa-sign-in-alt me-2"></i>Login as Admin</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
