<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Create Complaint - Smart Campus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>

    <div class="complaint-card">
        <h2><i class="fas fa-edit me-2"></i>Submit New Complaint</h2>
        
        <!-- Success Alert -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert" id="successAlert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${success}">Complaint submitted successfully</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <!-- Error Alert -->
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert" id="errorAlert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${error}">Error message</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <form action="/complaint/save" method="post" id="complaintForm">
            <div class="mb-4">
                <label class="form-label"><i class="fas fa-heading me-2"></i>Title</label>
                <input type="text" name="title" class="form-control" placeholder="e.g., WiFi not working in room 101" required>
            </div>
            
            <div class="mb-4">
                <label class="form-label"><i class="fas fa-align-left me-2"></i>Description</label>
                <textarea name="description" class="form-control" rows="4" placeholder="Please describe your issue in detail..." required></textarea>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-4">
                    <label class="form-label"><i class="fas fa-tag me-2"></i>Category</label>
                    <select name="category" class="form-select" required>
                        <option value="" disabled selected>Select a category</option>
                        <option value="Hostel">🏠 Hostel Issue</option>
                        <option value="WiFi">📶 WiFi Issue</option>
                        <option value="Classroom">📚 Classroom Issue</option>
                        <option value="Library">📖 Library Issue</option>
                        <option value="Maintenance">🔧 Maintenance</option>
                        <option value="Other">❓ Other</option>
                    </select>
                </div>
                
                <div class="col-md-6 mb-4">
                    <label class="form-label"><i class="fas fa-exclamation-triangle me-2"></i>Priority</label>
                    <select name="priority" class="form-select" required>
                        <option value="" disabled selected>Select priority level</option>
                        <option value="Low">🟢 Low</option>
                        <option value="Medium">🟡 Medium</option>
                        <option value="High">🔴 High</option>
                    </select>
                </div>
            </div>
            
            <div class="d-flex gap-3 mt-4">
                <button type="submit" class="btn btn-primary flex-grow-1" onclick="showLoading(this)">
                    <i class="fas fa-paper-plane me-2"></i>Submit Complaint
                </button>
                <a href="/users/dashboard" class="btn btn-secondary">
                    <i class="fas fa-times me-2"></i>Cancel
                </a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Show loading effect on button
        function showLoading(button) {
            button.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Submitting...';
        }

        // Auto-dismiss alerts after 5 seconds
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                const successAlert = document.getElementById('successAlert');
                const errorAlert = document.getElementById('errorAlert');
                
                if (successAlert) {
                    successAlert.style.transition = 'opacity 0.5s';
                    successAlert.style.opacity = '0';
                    setTimeout(() => successAlert.remove(), 500);
                }
                
                if (errorAlert) {
                    errorAlert.style.transition = 'opacity 0.5s';
                    errorAlert.style.opacity = '0';
                    setTimeout(() => errorAlert.remove(), 500);
                }
            }, 5000);
        });

        // Optional: Show toast for errors (if you want to keep toast functionality)
        window.onload = function() {
            const errorMsg = document.querySelector('.alert-danger span');
            if(errorMsg) {
                // You can remove this if you don't want both alert and toast
                console.log('Error:', errorMsg.textContent);
            }
        }
    </script>
</body>
</html>
