<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register - Smart Campus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .register-card { background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 450px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .register-card h2 { text-align: center; margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; position: relative; }
        .input-group-text { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; }
        .btn-register { background: linear-gradient(135deg, #667eea, #764ba2); color: white; width: 100%; padding: 12px; border-radius: 10px; border: none; }
        .password-toggle { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; z-index: 10; }
    </style>
</head>
<body>
    <div class="register-card">
        <h2><i class="fas fa-user-plus me-2"></i>Create Account</h2>
        <div th:if="${error}" class="alert alert-danger"><span th:text="${error}"></span></div>
        <form action="/users/register" method="post">
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-user"></i></span>
                <input type="text" name="name" class="form-control" placeholder="Full Name" required>
            </div>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                <input type="email" name="email" class="form-control" placeholder="Email Address" required>
            </div>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input type="password" name="password" id="password" class="form-control" placeholder="Password" required>
                <i class="fas fa-eye password-toggle" id="togglePassword" onclick="togglePassword()"></i>
            </div>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm Password" required onkeyup="checkPassword()">
                <i class="fas fa-eye password-toggle" id="toggleConfirm" onclick="toggleConfirm()"></i>
            </div>
            <small id="passwordMatchMsg" class="text-danger" style="display: none;">Passwords do not match!</small>
            <button type="submit" class="btn-register mt-3">Register</button>
            <div class="text-center mt-3"><a href="/user/login">Already have an account? Login</a> | <a href="/">Back to Home</a></div>
        </form>
    </div>
    <script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('togglePassword');
            if (pwd.type === 'password') { pwd.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash'); }
            else { pwd.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye'); }
        }
        function toggleConfirm() {
            const conf = document.getElementById('confirmPassword');
            const icon = document.getElementById('toggleConfirm');
            if (conf.type === 'password') { conf.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash'); }
            else { conf.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye'); }
        }
        function checkPassword() {
            const pwd = document.getElementById('password').value;
            const conf = document.getElementById('confirmPassword').value;
            const msg = document.getElementById('passwordMatchMsg');
            msg.style.display = pwd !== conf ? 'block' : 'none';
        }
    </script>
</body>
</html>
